name: Repository audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public-release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: false

      - name: Run dependency-free repository audit
        shell: bash
        run: |
          set -o pipefail
          node scripts/repository-audit.mjs 2>&1 | tee repository-audit.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-audit
          path: repository-audit.txt
          if-no-files-found: warn
          retention-days: 14

  rust-validation:
    name: Rust validation
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Record Rust toolchain
        shell: bash
        run: |
          rustc --version | tee rust-toolchain.txt
          cargo --version | tee -a rust-toolchain.txt
          rustup component add rustfmt clippy

      - name: Check Rust formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check 2>&1 | tee cargo-fmt.txt

      - name: Run strict Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee cargo-clippy.txt

      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.txt

      - name: Verify glib is absent from the Windows target graph
        shell: bash
        run: |
          set +e
          cargo tree --locked --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc --invert glib \
            > windows-glib-tree.txt 2>&1
          cat windows-glib-tree.txt
          if grep -Eq '^glib v' windows-glib-tree.txt; then
            echo "glib unexpectedly appears in the Windows target dependency graph" >&2
            exit 1
          fi
          exit 0

      - name: Install cargo-audit
        shell: bash
        run: cargo install cargo-audit --locked

      - name: Audit Rust lockfile
        shell: bash
        run: |
          set -o pipefail
          cargo audit --file src-tauri/Cargo.lock 2>&1 | tee rust-audit.txt

      - name: Upload Rust validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-validation
          path: |
            rust-toolchain.txt
            cargo-fmt.txt
            cargo-clippy.txt
            cargo-test.txt
            windows-glib-tree.txt
            rust-audit.txt
          if-no-files-found: warn
          retention-days: 14

  node-validation:
    name: Standalone Node validation
    needs:
      - audit
      - rust-validation
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: false

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.24.0

      - name: Install standalone dependencies from lockfile
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.txt

      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level=high 2>&1 | tee dependency-audit.txt

      - name: Run repository audit
        shell: bash
        run: |
          set -o pipefail
          pnpm repository:audit 2>&1 | tee audit-validation.txt

      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.txt

      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.txt

      - name: Build Node surface
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.txt

      - name: Run unit and integration tests with coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage-tests.txt

      - name: Summarize coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm coverage:summary 2>&1 | tee coverage-summary.txt

      - name: Install Chromium for Playwright
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee playwright-install.txt

      - name: Run Playwright UI smoke tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ui 2>&1 | tee playwright.txt

      - name: Upload standalone validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-node-validation
          path: |
            pnpm-lock.yaml
            install.txt
            dependency-audit.txt
            audit-validation.txt
            lint.txt
            typecheck.txt
            build.txt
            coverage-tests.txt
            coverage-summary.txt
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
            playwright-install.txt
            playwright.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14