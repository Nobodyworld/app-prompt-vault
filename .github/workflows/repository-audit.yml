name: Repository audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public-release invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: false

      - name: Run dependency-free repository audit
        shell: bash
        run: |
          set -o pipefail
          node scripts/repository-audit.mjs 2>&1 | tee repository-audit.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-audit
          path: repository-audit.txt
          if-no-files-found: warn
          retention-days: 14

  node-validation:
    name: Standalone Node validation
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          check-latest: false

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.24.0

      - name: Install standalone dependencies from lockfile
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.txt

      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --prod --audit-level=high 2>&1 | tee dependency-audit.txt

      - name: Run repository audit
        shell: bash
        run: |
          set -o pipefail
          pnpm repository:audit 2>&1 | tee audit-validation.txt

      - name: Run lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.txt

      - name: Run typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.txt

      - name: Build Node surface
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.txt

      - name: Run unit and integration tests with coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee coverage-tests.txt

      - name: Summarize coverage
        shell: bash
        run: |
          set -o pipefail
          pnpm coverage:summary 2>&1 | tee coverage-summary.txt

      - name: Install Chromium for Playwright
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee playwright-install.txt

      - name: Run Playwright UI smoke tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test:ui 2>&1 | tee playwright.txt

      - name: Upload standalone validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-node-validation
          path: |
            pnpm-lock.yaml
            install.txt
            dependency-audit.txt
            audit-validation.txt
            lint.txt
            typecheck.txt
            build.txt
            coverage-tests.txt
            coverage-summary.txt
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
            playwright-install.txt
            playwright.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14