name: Runner diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: runner-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Runner startup diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner startup
        shell: bash
        run: |
          echo "runner-started"
          node --version
          npm --version
