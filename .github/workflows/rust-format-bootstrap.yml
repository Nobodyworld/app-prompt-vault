name: Rust format bootstrap

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-format-bootstrap:
    name: Apply canonical Rust formatting
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/pr27-rust-advisory-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ci/pr27-rust-advisory-audit

      - name: Apply cargo fmt
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatted Rust files once
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: apply canonical Rust formatting"
          git push origin HEAD:ci/pr27-rust-advisory-audit