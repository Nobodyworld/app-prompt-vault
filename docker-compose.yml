version: "3.8"

services:
  prompt-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prompt-vault
    ports:
      - "3001:3001"
    volumes:
      # Persist SQLite database
      - prompt_vault_data:/app/data
      # Optional: Mount logs directory for external access
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PROMPT_VAULT_DB_PATH=/app/data/prompt-vault.db
      # Configure CORS for external access (adjust as needed)
      - PROMPT_VAULT_CORS_ORIGINS=*
      # Enable metrics endpoint
      - PROMPT_VAULT_METRICS=true
      - PROMPT_VAULT_METRICS_PORT=9090
      # Configure limits
      - PROMPT_VAULT_MAX_FILE_SIZE_BYTES=10485760
      - PROMPT_VAULT_MAX_PROMPT_CONTENT_LENGTH=102400
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/observability/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - prompt-vault-network

  # Optional: Metrics service (Prometheus-compatible)
  # Uncomment and configure if you want to expose metrics externally
  # metrics:
  #   image: prom/prometheus:latest
  #   container_name: prompt-vault-metrics
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'
  #     - '--storage.tsdb.retention.time=200h'
  #     - '--web.enable-lifecycle'
  #   networks:
  #     - prompt-vault-network

volumes:
  prompt_vault_data:
    driver: local

networks:
  prompt-vault-network:
    driver: bridge
